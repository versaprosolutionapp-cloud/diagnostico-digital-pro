<script type="text/babel">
const { useState, useEffect, useRef } = React;
const NAVY = "#0B1F3A";
const GOLD = "#C9A84C";
const AREAS = [
  { key: "web", label: "Página Web", icon: "🌐" },
  { key: "gmaps", label: "Google Maps", icon: "📍" },

  { key: "gmaps", label: "Google Business", icon: "📍" },
  { key: "zillow", label: "Zillow/Realtor.com", icon: "🏠" },
  { key: "directorios", label: "Homes/MapQuest/Yelp", icon: "📌" },

];

  "Página web para agente": 349,
  "Configuración WhatsApp Business": 99,
  "Setup Instagram/Facebook + bio": 149,
  "Plan de contenido mensual (redes)": 249,
  "Gestión de reseñas (1 mes)": 149,

// ===== Resolución de identidad multiseñal (Diagnóstico Digital Pro · ajuste 2) =====
const DDP_ID = (() => {
  const sinAcentos = t => String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
  const normTel = t => { const d=String(t||"").replace(/\D/g,""); if(d.length===11&&d[0]==="1") return d.slice(1); return d.length===10?d:(d.length>=7?d:""); };
  const mismoTel = (a,b) => { const x=normTel(a), y=normTel(b); return !!x && !!y && x===y; };
  const fmtTel = d => { const x=normTel(d); return x.length===10?`(${x.slice(0,3)}) ${x.slice(3,6)}-${x.slice(6)}`:(x||""); };
  const telVariantes = t => { const x=normTel(t); if(x.length!==10) return []; return [x, fmtTel(x), `${x.slice(0,3)}-${x.slice(3,6)}-${x.slice(6)}`, `+1 ${x.slice(0,3)} ${x.slice(3,6)} ${x.slice(6)}`, `${x.slice(0,3)}.${x.slice(3,6)}.${x.slice(6)}`]; };
  // Variantes razonables del nombre (sin inventar personas: solo recombinaciones del nombre dado)
  const variantesNombre = (nombre, ciudad, brokerage) => {
    const limpio = String(nombre||"").replace(/\s+/g," ").trim(); if(!limpio) return [];
    const tok = limpio.split(" ").filter(Boolean); const v = new Set([limpio]);
    const sa = sinAcentos(limpio); v.add(sa);
    if (tok.length>=3) { v.add(`${tok[0]} ${tok[tok.length-1]}`); v.add(`${tok[0]} ${tok[tok.length-2]}`); v.add(`${tok[0]} ${tok[1]} ${tok[tok.length-2]}`); v.add(`${tok[0]}${tok[1]} ${tok.slice(2).join(" ")}`); v.add(`${tok[0]}${tok[1]} ${tok[tok.length-2]}`); v.add(`${tok[0]}${tok[1]} ${tok[tok.length-1]}`); }
    if (tok.length===2) { v.add(`${tok[0]}${tok[1]}`); }
    if (tok.length>=2) { v.add(`${tok[0]} ${tok[tok.length-1]}`); v.add(`${tok[0]}${tok[1]}`); }
    const base = Array.from(v).map(sinAcentos);
    const out = new Set(base);
    base.slice(0,4).forEach(b => { if(ciudad) out.add(`${b} ${ciudad}`); out.add(`${b} Realtor`); out.add(`${b} Real Estate`); if(brokerage) out.add(`${b} ${brokerage}`); });
    return Array.from(out).filter(x=>x.trim().length>2).slice(0,24);
  };
  // Señales: fuertes vs complementarias (clasificación conceptual, no puntaje opaco)
  const FUERTES = ["telefono","correo","dominio","enlace","direccion","brokerage+telefono","licencia"];
  const COMPLEMENTARIAS = ["ciudad","actividad","nombre","nombre_parecido","foto","equipo","brokerage","branding"];
  const normSenal = x => { const t=sinAcentos(String(x||"")).toLowerCase().trim(); if(/broker/.test(t)&&/tel|phone|whats/.test(t)) return "brokerage+telefono"; if(/tel|phone|whats/.test(t)) return "telefono"; if(/correo|email|mail/.test(t)) return "correo"; if(/dominio|domain|sitio|web/.test(t)) return "dominio"; if(/enlace|link|vinculo|linktree|bio/.test(t)) return "enlace"; if(/direcci|address|oficina/.test(t)) return "direccion"; if(/licen|dbpr|trec/.test(t)) return "licencia"; if(/nombre|name/.test(t)) return /parecid|similar|variante|distint|diferen/.test(t)?"nombre_parecido":"nombre"; if(/broker/.test(t)) return "brokerage"; if(/ciudad|zona|city|orlando|area/.test(t)) return "ciudad"; if(/activid|profes|real ?estate|realtor|inmobil/.test(t)) return "actividad"; if(/equipo|team/.test(t)) return "equipo"; if(/foto|imagen|branding|logo/.test(t)) return "foto"; return t; };
  const esFuerte = c => { const n=normSenal(c); return FUERTES.includes(n); };
  // Ajuste conservador del estado que declara el modelo, según las señales que él mismo registró
  const ajustarEstado = (estadoModelo, coincidencias, diferencias, ctx) => {
    const co=(coincidencias||[]).map(normSenal), di=(diferencias||[]).map(normSenal);
    let fuertes = co.filter(c=>FUERTES.includes(c));
    if (co.includes("brokerage") && co.includes("telefono")) fuertes.push("brokerage+telefono");
    if (ctx && ctx.telefonoCoincide && !fuertes.includes("telefono")) fuertes.push("telefono");
    const comp = co.filter(c=>COMPLEMENTARIAS.includes(c));
    const difNombre = di.some(d=>d==="nombre"||d==="nombre_parecido");
    const difFuerte = di.some(d=>FUERTES.includes(d)); // teléfono/correo/dominio/dirección distintos: pesa en contra
    const e = estadoModelo;
    if (e==="NO_LOCALIZADO") return {estado:e, fuertes, comp, motivo:"sin candidato"};
    if (e==="CONFIRMADO") {
      if (fuertes.length===0) return {estado: comp.length>=3 ? "COINCIDENCIA_PROBABLE" : "REQUIERE_VERIFICACION", fuertes, comp, motivo:"el modelo confirmó sin una señal fuerte registrada"};
      if (difNombre && fuertes.length===1) return {estado:"COINCIDENCIA_PROBABLE", fuertes, comp, motivo:"una sola señal fuerte y el nombre mostrado difiere"};
      if (difFuerte && fuertes.length<2) return {estado:"COINCIDENCIA_PROBABLE", fuertes, comp, motivo:"hay un dato de contacto distinto al suministrado"};
      return {estado:"CONFIRMADO", fuertes, comp, motivo:""};
    }
    if (e==="COINCIDENCIA_PROBABLE") {
      if (fuertes.length===0 && comp.length<3) return {estado:"REQUIERE_VERIFICACION", fuertes, comp, motivo:"solo nombre/ciudad: insuficiente para coincidencia probable"};
      return {estado:"COINCIDENCIA_PROBABLE", fuertes, comp, motivo:""};
    }
    // REQUIERE_VERIFICACION declarado por el modelo: puede subir a probable solo con señal fuerte explícita
    if (fuertes.length>=1 && !difNombre && !difFuerte) return {estado:"COINCIDENCIA_PROBABLE", fuertes, comp, motivo:"señal fuerte registrada"};
    return {estado:"REQUIERE_VERIFICACION", fuertes, comp, motivo:""};
  };
  // Huella de identidad: separa lo suministrado por el consultor de lo encontrado en fuentes públicas
  const nuevaHuella = (intake) => ({
    suministrado: { nombre: intake.nombre||"", ciudad: intake.ciudad||"", estado: intake.estado||"", telefono: normTel(intake.telefono)||"", brokerage: intake.brokerage||"", notas: intake.notas||"" },
    variantes_sugeridas: variantesNombre(intake.nombre, intake.ciudad, intake.brokerage),
    telefono_variantes: telVariantes(intake.telefono),
    encontrado: { nombres:[], telefonos:[], correos:[], dominios:[], handles:[], brokerage:[], direcciones:[], equipo:[] },
    coincide: [], busquedas: [], urls_vistas: []
  });
  const push = (arr, v, fuente) => { if(!v) return; const val=String(v).trim(); if(!val || arr.some(x=>x.v.toLowerCase()===val.toLowerCase())) return; arr.push({v:val, fuente:fuente||""}); };
  const enriquecerHuella = (h, d1) => {
    const enc = h.encontrado, hf = (d1.huella_encontrada||{});
    ["nombres","telefonos","correos","dominios","handles","brokerage","direcciones","equipo"].forEach(k => (hf[k]||[]).forEach(x => push(enc[k], typeof x==="string"?x:x.v, typeof x==="string"?"":x.fuente)));
    (d1.identidad?.nombres_encontrados||[]).forEach(n=>push(enc.nombres,n,"identidad"));
    (d1.identidad?.telefonos_encontrados||[]).forEach(t=>push(enc.telefonos,t,"identidad"));
    if (d1.analisis_gmaps?.nombre_perfil) push(enc.nombres, d1.analisis_gmaps.nombre_perfil, "google");
    if (d1.analisis_zillow?.nombre_perfil) push(enc.nombres, d1.analisis_zillow.nombre_perfil, "zillow");
    if (/^https?:|www\./i.test(d1.url_encontrada||"")) push(enc.dominios, d1.url_encontrada, "web");
    if (d1.brokerage) push(enc.brokerage, d1.brokerage, "resultados");
    (d1.candidatos||[]).forEach(c => { if(c&&c.nombre_mostrado) push(enc.nombres, c.nombre_mostrado, c.plataforma||plataformaDeUrl(c.url)); if(c&&c.telefono) push(enc.telefonos, c.telefono, c.plataforma||""); if(c&&c.url&&(c.plataforma==="web"||plataformaDeUrl(c.url)==="web")) push(enc.dominios, c.url, "candidato"); });
    h.busquedas = Array.from(new Set([...(h.busquedas||[]), ...(d1.busquedas||[])]));
    // coincidencias entre lo suministrado y lo encontrado (nunca convierte suministrado en confirmado por sí solo)
    h.coincide = [];
    if (h.suministrado.telefono && enc.telefonos.some(t=>mismoTel(t.v,h.suministrado.telefono))) h.coincide.push("telefono");
    if (h.suministrado.brokerage && enc.brokerage.some(b=>sinAcentos(b.v).toLowerCase().includes(sinAcentos(h.suministrado.brokerage).toLowerCase().split(" ")[0]))) h.coincide.push("brokerage");
    return h;
  };
  // Plataformas: patrón de dominio, y si web_fetch puede leerlas (sin JavaScript) o no
  const PLATAFORMAS = [
    {k:"google", re:/(^|[./])google\.[a-z.]+\/maps|(^|[./])g\.co\/|maps\.app\.goo\.gl|business\.google/i, fetch:false},
    {k:"zillow", re:/(^|[./])zillow\.com/i, fetch:true},
    {k:"realtor_com", re:/(^|[./])realtor\.com/i, fetch:true},
    {k:"homes", re:/(^|[./])homes\.com/i, fetch:true},
    {k:"mapquest", re:/(^|[./])mapquest\.com/i, fetch:true},
    {k:"yelp", re:/(^|[./])yelp\.com/i, fetch:true},
    {k:"instagram", re:/(^|[./])instagram\.com/i, fetch:false},
    {k:"facebook", re:/(^|[./])(facebook|fb)\.com/i, fetch:false},
    {k:"tiktok", re:/(^|[./])tiktok\.com/i, fetch:false},
    {k:"linkedin", re:/(^|[./])linkedin\.com/i, fetch:false},
    {k:"linktree", re:/(^|[./])linktr\.ee|(^|[./])beacons\.ai/i, fetch:true},
    {k:"youtube", re:/(^|[./])(youtube\.com|youtu\.be)/i, fetch:false},
  ];
  const DOMINIOS_GENERICOS = /(google\.|bing\.|yahoo\.|wikipedia\.|amazon\.|apple\.|microsoft\.)/i;
  const hostDe = url => { try { return new URL(String(url)).hostname.replace(/^www\./,"").toLowerCase(); } catch(e) { return ""; } };
  const plataformaDeUrl = url => { const u=String(url||""); const p=PLATAFORMAS.find(x=>x.re.test(u)); return p?p.k:(hostDe(u)?"web":""); };
  const fetchable = url => { const u=String(url||""); const p=PLATAFORMAS.find(x=>x.re.test(u)); if(p) return p.fetch; return !!hostDe(u) && !DOMINIOS_GENERICOS.test(u); };
  const tokensNombre = nombre => Array.from(new Set(sinAcentos(String(nombre||"")).toLowerCase().split(/[^a-z]+/).filter(t=>t.length>=4)));
  // ¿La URL o el título contienen al menos dos partes del nombre (o una forma unida como "marialejandra")?
  const urlCoincideNombre = (url, title, nombre) => {
    const tk = tokensNombre(nombre); if(!tk.length) return false;
    const txt = sinAcentos(String(url||"")+" "+String(title||"")).toLowerCase().replace(/[^a-z]+/g," ");
    const flat = txt.replace(/\s+/g,"");
    const hits = tk.filter(t=>flat.includes(t)).length;
    const unido = tk.length>=2 && flat.includes(tk[0]+tk[1]);
    return hits>=2 || unido;
  };
  // URLs vistas en resultados de búsqueda que parecen ser del cliente (no se evalúan: solo se conservan como pista)
  const filtrarUrlsVistas = (resultados, nombre, previas) => {
    const out = [...(previas||[])]; const seen = new Set(out.map(x=>x.url));
    (resultados||[]).forEach(r => {
      if(!r||!r.url||seen.has(r.url)) return;
      const plat = plataformaDeUrl(r.url); if(!plat) return;
      if(plat==="web" && DOMINIOS_GENERICOS.test(r.url)) return;
      if(!urlCoincideNombre(r.url, r.title, nombre)) return;
      seen.add(r.url); out.push({url:r.url, title:String(r.title||"").slice(0,80), plataforma:plat});
    });
    return out.slice(0,30);
  };
  const urlVistaPara = (plataforma, urls) => (urls||[]).find(u=>u.plataforma===plataforma) || null;
  // Candidatos de R0: solo confianza alta/media y con al menos 2 señales entran a la lista de apertura
  const DOMINIOS_FETCH_BASE = ["zillow.com","realtor.com","homes.com","yelp.com","mapquest.com","linktr.ee"];
  const candidatosAbribles = cands => (cands||[]).filter(c => c && c.url && fetchable(c.url) && (c.confianza==="alta" || (c.confianza==="media" && (c.senales||[]).length>=2)));
  const dominiosFetch = cands => Array.from(new Set([...DOMINIOS_FETCH_BASE, ...candidatosAbribles(cands).map(c=>hostDe(c.url)).filter(Boolean)]));
  const candidatosTexto = (cands, urls) => {
    const abr = candidatosAbribles(cands);
    const lin = (cands||[]).map(c=>`- [${c.plataforma||plataformaDeUrl(c.url)}] ${c.url||"(sin url)"} | nombre mostrado: ${c.nombre_mostrado||"?"} | señales: ${(c.senales||[]).join(", ")||"ninguna"}${(c.diferencias||[]).length?" | diferencias: "+c.diferencias.join(", "):""} | confianza: ${c.confianza||"?"}${abr.includes(c)?" | ABRIBLE con web_fetch":""}`);
    const vis = (urls||[]).slice(0,25).map(u=>`- [${u.plataforma}] ${u.url}${u.title?" — "+u.title:""}`);
    return `CANDIDATOS_IDENTIFICADOS (paso 0):\n${lin.join("\n")||"- ninguno"}\nURLS_VISTAS_EN_RESULTADOS (no evaluadas; pueden ser del cliente o de un homónimo):\n${vis.join("\n")||"- ninguna"}`;
  };
  const huellaTexto = h => JSON.stringify({
    SUMINISTRADO_POR_CONSULTOR: h.suministrado,
    VARIANTES_DE_NOMBRE_A_PROBAR: h.variantes_sugeridas,
    TELEFONO_FORMATOS_EQUIVALENTES: h.telefono_variantes,
    ENCONTRADO_EN_FUENTES_PUBLICAS: h.encontrado,
    COINCIDE_SUMINISTRADO_VS_PUBLICO: h.coincide,
    VARIANTES_YA_PROBADAS: h.busquedas,
    URLS_VISTAS: (h.urls_vistas||[]).map(u=>u.url)
  });
  return { PLATAFORMAS, hostDe, plataformaDeUrl, fetchable, urlCoincideNombre, filtrarUrlsVistas, urlVistaPara, candidatosAbribles, dominiosFetch, candidatosTexto, sinAcentos, normTel, mismoTel, fmtTel, telVariantes, variantesNombre, normSenal, esFuerte, ajustarEstado, nuevaHuella, enriquecerHuella, huellaTexto, FUERTES, COMPLEMENTARIAS };
})();
window.DDP_ID = DDP_ID;

const PROTOCOLO = `PROTOCOLO DE BÚSQUEDA (obligatorio ANTES de declarar que un activo no fue localizado): busca con web_search usando variantes razonables — nombre completo; con y sin segundo apellido; nombre unido y separado (ej. "Marialejandra" / "Maria Alejandra"); nombre + ciudad; nombre + Realtor; nombre + Real Estate; nombre + brokerage si se conoce; teléfono si está disponible; y toda clave nueva que aporte un activo ya confirmado (usuario de Instagram, nombre exacto de la ficha de Google, teléfono o correo visto en un directorio, nombre de equipo). Un activo encontrado da claves para buscar los demás. Registra las variantes usadas en "busquedas".
RESOLUCIÓN DE IDENTIDAD MULTISEÑAL: el nombre es UNA señal, no la única ni la más fuerte. Construye una huella del agente y úsala en cadena: entrada (nombre + ciudad + teléfono opcional + brokerage si lo hay) → buscar candidatos con las VARIANTES_DE_NOMBRE_A_PROBAR y con el teléfono en sus FORMATOS_EQUIVALENTES → extraer señales de cada candidato (nombre mostrado, teléfono, correo, dominio, dirección, brokerage, handles, nombre de equipo, enlaces a otras plataformas) → reutilizar esas señales para buscar Google Business, web, Zillow, Realtor.com, Facebook, Instagram y directorios → comparar candidatos → asignar estado. Un candidato con nombre distinto pero teléfono/correo/dominio/enlace igual ES el mismo agente; dos perfiles con nombre parecido y nada más NO lo son.
SEÑALES FUERTES: mismo teléfono; mismo correo; mismo dominio/sitio; enlace directo entre plataformas (bio, Linktree, "sitio web" de la ficha); brokerage + teléfono; dirección profesional coincidente; licencia. SEÑALES COMPLEMENTARIAS: ciudad/zona; actividad inmobiliaria; nombre parecido; nombre de equipo; foto/branding verificable. Cada activo devuelve "coincidencias" y "diferencias" con esas etiquetas (ej. ["telefono","ciudad","actividad"] / ["nombre mostrado"]) y "evidencia" con la URL/fuente: la asociación se justifica con evidencia, no con un puntaje.
ESTADOS DE CERTEZA (cada activo lleva "estado"): "CONFIRMADO" = al menos una señal FUERTE (o enlace directo desde un activo ya confirmado) y sin diferencias relevantes; "COINCIDENCIA_PROBABLE" = varias señales coinciden (al menos una fuerte, o ciudad + actividad + brokerage + nombre parecido) pero queda una diferencia relevante que el consultor/cliente debe confirmar (típico: nombre mostrado distinto, brokerage no visible); "REQUIERE_VERIFICACION" = hay un candidato o información relacionada pero la evidencia es insuficiente (solo nombre parecido + ciudad); "NO_LOCALIZADO" = tras las búsquedas razonables no apareció un candidato suficientemente relacionado, lo cual NO significa que no exista. Nombre parecido + ciudad NUNCA sube solos a COINCIDENCIA_PROBABLE ni a CONFIRMADO.
DATOS SUMINISTRADOS: lo que da el consultor (teléfono, brokerage, notas) son PISTAS para buscar y cruzar; un dato suministrado no convierte un activo en CONFIRMADO. Distingue en la huella: suministrado por consultor / encontrado en fuente pública / coincidencia entre ambos. Nunca muestres ni inventes teléfonos, correos o direcciones que no hayan sido suministrados o vistos en evidencia. PROHIBIDO convertir NO_LOCALIZADO en "no existe", "ausente", "sin perfil", "0 reseñas", "inactivo" o "incumplimiento". Si el estado no es CONFIRMADO: score = null, cantidades de reseñas/seguidores = null; para COINCIDENCIA_PROBABLE los items dicen "coincidencia probable — confirmar identidad con el cliente" y describen el candidato; para NO_LOCALIZADO dicen "no localizado en la revisión inicial — confirmar con el cliente (URL, usuario o teléfono) y repetir la búsqueda". En "evidencia" pon la URL o fuente vista; si no la viste, "".
CUMPLIMIENTO: marca "incumplimiento" SOLO con evidencia visible en un activo confirmado (ej. el sitio muestra el teléfono sin el nombre del brokerage). Si solo falta información o no localizaste el registro TREC/DBPR del agente, usa exactamente: "Información TREC/FREC-DBPR pendiente de verificación" con estado REQUIERE_VERIFICACION. Un registro de licencia no localizado NO es falta de licencia.
IDENTIDAD: registra TODAS las formas del nombre que veas en las plataformas en identidad.nombres_encontrados (y teléfonos en telefonos_encontrados). Si difieren, nap_inconsistente=true y recomienda verificar primero el nombre profesional/licenciado correcto con el agente; NO decidas tú cuál debe usarse.
AFIRMACIONES: cifras (seguidores, ventas, reseñas, ratings, años, premios) solo si las viste; de lo contrario null o "por verificar". Nada de promesas de resultado: prohibido "#1", "número 1", "posicionarte como", "superar a", "garantizado".

const extractJSON = (raw) => {
  const text = (raw.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").replace(/```json/gi,"").replace(/```/g,"").trim();
  const start = text.indexOf("{");
  if (start===-1) throw new Error("No JSON encontrado");
  let depth=0, end=-1;
  for(let i=start;i<text.length;i++){
    if(text[i]==="{") depth++;
    else if(text[i]==="}"){depth--;if(depth===0){end=i;break;}}
  }
  if(end!==-1){try{return JSON.parse(text.slice(start,end+1));}catch(e){}}
  let partial=end!==-1?text.slice(start,end+1):text.slice(start);
  try{return JSON.parse(partial);}catch(e){
    let ob=0,ob2=0,inS=false,esc=false;
    for(let i=0;i<partial.length;i++){
      const ch=partial[i];
      if(esc){esc=false;continue;}
      if(ch==='\\'&&inS){esc=true;continue;}
      if(ch==='"'){inS=!inS;continue;}
      if(inS)continue;
      if(ch==='{')ob++;else if(ch==='}')ob--;else if(ch==='[')ob2++;else if(ch===']')ob2--;
    }
    let fixed=partial.replace(/,\s*$/,'').replace(/,\s*([}\]])/g,'$1');
    if(inS)fixed+='"';
    fixed+=']'.repeat(Math.max(0,ob2))+'}' .repeat(Math.max(0,ob));
    try{return JSON.parse(fixed);}catch(e2){throw new Error("JSON incompleto. Intenta de nuevo.");}
  }
};

const callAPI = async (system, userMsg, opts) => {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, userMsg, ...(opts||{}) }),
  });
  const txt = await res.text();
  let raw; try { raw = JSON.parse(txt); } catch(e) { throw new Error(`El servidor no respondió JSON (HTTP ${res.status}): ${txt.slice(0,120)}`); }
  if (raw.error) throw new Error(raw.error);
  const data = extractJSON(raw);
  data._evidencia = raw._evidencia || null; // consultas, URLs vistas, aperturas y uso, conservados por el servidor
  return data;
};
