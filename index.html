const extractJSON = (raw) => {
  const text = (raw.content || [])
    .filter(b => b.type === "text")
    .map(b => b.text)
    .join("")
    .replace(/```json/gi, "")
    .replace(/```/g, "")
    .trim();

  const start = text.indexOf("{");
  if (start === -1) throw new Error("No se encontró JSON en la respuesta");

  let depth = 0, end = -1;
  for (let i = start; i < text.length; i++) {
    if (text[i] === "{") depth++;
    else if (text[i] === "}") {
      depth--;
      if (depth === 0) { end = i; break; }
    }
  }

  if (end !== -1) {
    try { return JSON.parse(text.slice(start, end + 1)); } catch (e) {}
  }

  let partial = end !== -1 ? text.slice(start, end + 1) : text.slice(start);
  try { return JSON.parse(partial); } catch(e) {
    let openBraces = 0, openBrackets = 0, inString = false, escaped = false;
    for (let i = 0; i < partial.length; i++) {
      const ch = partial[i];
      if (escaped) { escaped = false; continue; }
      if (ch === '\\' && inString) { escaped = true; continue; }
      if (ch === '"') { inString = !inString; continue; }
      if (inString) continue;
      if (ch === '{') openBraces++;
      else if (ch === '}') openBraces--;
      else if (ch === '[') openBrackets++;
      else if (ch === ']') openBrackets--;
    }
    let fixed = partial.replace(/,\s*$/, '').replace(/,\s*([}\]])/g, '$1');
    if (inString) fixed += '"';
    fixed += ']'.repeat(Math.max(0, openBrackets)) + '}'.repeat(Math.max(0, openBraces));
    try { return JSON.parse(fixed); } catch(e2) {
      throw new Error("JSON incompleto. Por favor intenta de nuevo.");
    }
  }
};

const callAPI = async (system, userMsg) => {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, userMsg }),
  });
  const raw = await res.json();
  if (raw.error) throw new Error(typeof raw.error === "string" ? raw.error : raw.error.message);
  return extractJSON(raw);
};

  const d = new Date(Date.now() + 48 * 3600 * 1000);
  return d.toLocaleDateString("es-US", { weekday: "long", day: "numeric", month: "long" });
};

          )}

          {tab === "web" && (
            <div>
              <CanalCard titulo="Página Web" icon="🌐" canal={canales.web} />
              <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem" }}>
                <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 12px", color: "#111827" }}>Señales observadas en la web</p>
                <HallazgoList items={b1.hallazgos_web} />
              </div>
            </div>
          )}

          {tab === "google" && (
            <div>
              <CanalCard titulo="Presencia en Google Search" icon="🔎" canal={canales.gsearch} />
              <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem", marginBottom: 10 }}>
                <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 12px", color: "#111827" }}>Señales en Google Search</p>
                <HallazgoList items={b1.hallazgos_gsearch} />
              </div>

              <CanalCard titulo="Google Business Profile" icon="🏷️" canal={canales.gbp} />
              <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem", marginBottom: 10 }}>
                <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 12px", color: "#111827" }}>Señales en Google Business Profile</p>
                <HallazgoList items={b1.hallazgos_gbp} />
              </div>

              <CanalCard titulo="Google Maps" icon="📍" canal={canales.gmaps} />
              {b1.resenas && (
                <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem", marginBottom: 10 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                    <p style={{ fontSize: 13, fontWeight: 500, margin: 0, color: "#111827" }}>Reseñas observadas</p>
                    <EvBadge ev={b1.resenas.evidencia} />
                  </div>
                  <div style={{ display: "flex", gap: 16, marginTop: 6 }}>
                    <span style={{ fontSize: 13 }}>⭐ {b1.resenas.promedio}</span>
                    <span style={{ fontSize: 13, color: "#6b7280" }}>{b1.resenas.cantidad} reseñas</span>
                  </div>
                </div>
              )}
              <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem" }}>
                <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 12px", color: "#111827" }}>Señales en Google Maps</p>
                <HallazgoList items={b1.hallazgos_gmaps} />
              </div>
            </div>
          )}

          {tab === "social" && (
            <div>
              <CanalCard titulo="Redes Sociales" icon="📱" canal={canales.social} />
              {b2.social?.map((p, i) => (
                <div key={i} style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem", marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8, flexWrap: "wrap" }}>
                    <p style={{ fontWeight: 500, fontSize: 14, margin: 0, color: "#111827" }}>📱 {p.red} <span style={{ fontSize: 12, color: "#9ca3af", fontWeight: 400 }}>{p.handle}</span></p>
                    <EstadoTag valor={p.estado} />
                  </div>
                  {p.frecuencia && <p style={{ fontSize: 12, color: "#6b7280", margin: "0 0 4px" }}>Frecuencia observada: {p.frecuencia}</p>}
                  {p.d && <p style={{ fontSize: 12, color: "#6b7280", margin: 0, lineHeight: 1.5 }}>{p.d}</p>}
                </div>
              ))}
              <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem" }}>
                <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 12px", color: "#111827" }}>Señales en redes</p>
                <HallazgoList items={b2.hallazgos_social} />
              </div>
            </div>
          )}

          {tab === "competidores" && (
            <div>
              <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem" }}>
                <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 14px", color: "#111827" }}>🏆 Competidores observados en la revisión inicial</p>
                {(!b2.competidores || b2.competidores.length === 0) && (
                  <p style={{ fontSize: 12, color: "#9ca3af", margin: 0, fontStyle: "italic" }}>No se observaron competidores con evidencia suficiente en esta revisión inicial.</p>
                )}
                {b2.competidores?.map((c, i) => (
                  <div key={i} style={{ marginBottom: 18, paddingBottom: 18, borderBottom: i < b2.competidores.length - 1 ? "1px solid #f3f4f6" : "none" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, gap: 8, flexWrap: "wrap" }}>
                      <div>
                        <p style={{ fontWeight: 600, fontSize: 13, margin: 0, color: "#111827" }}>{c.nombre}</p>
                        <p style={{ fontSize: 11, color: "#9ca3af", margin: "2px 0 0" }}>{c.zona} · {c.nicho}</p>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        {c.resenas && <span style={{ fontSize: 11, color: "#9ca3af" }}>📝 {c.resenas} reseñas</span>}
                        <EvBadge ev={c.evidencia} />
                      </div>
                    </div>
                    {c.fortaleza_visible && <p style={{ fontSize: 12, color: "#16a34a", margin: "0 0 3px" }}>✅ {c.fortaleza_visible}</p>}
                    {c.posible_debilidad && <p style={{ fontSize: 12, color: "#E65100", margin: 0 }}>⚠️ Posible debilidad: {c.posible_debilidad}</p>}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {view === "consultor" && (
        <div>
          <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem", marginBottom: 12 }}>
            <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 14px", color: "#111827" }}>🧭 Síntesis preliminar de campo</p>

            {b2.sintesis?.fortalezas_visibles?.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: "#2E7D32", margin: "0 0 6px" }}>✅ Fortalezas visibles</p>
                {b2.sintesis.fortalezas_visibles.map((f, i) => (
                  <div key={i} style={{ paddingLeft: 12, borderLeft: "3px solid #16a34a", marginBottom: 8 }}>
                    <p style={{ fontSize: 13, margin: 0, color: "#374151", lineHeight: 1.5 }}>{f.texto}</p>
                    <p style={{ fontSize: 11, color: "#9ca3af", margin: "2px 0 0" }}>
                      {f.confianza && <span>Confianza: <b style={{ color: confColor[f.confianza] || "#6b7280" }}>{f.confianza}</b></span>}
                      {f.fuente && <span> · Fuente: {f.fuente}</span>}
                    </p>
                  </div>
                ))}
              </div>
            )}

            {b2.sintesis?.posibles_debilidades?.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: "#E65100", margin: "0 0 6px" }}>⚠️ Posibles debilidades</p>
                {b2.sintesis.posibles_debilidades.map((d, i) => (
                  <div key={i} style={{ paddingLeft: 12, borderLeft: "3px solid #E65100", marginBottom: 8 }}>
                    <p style={{ fontSize: 13, margin: 0, color: "#374151", lineHeight: 1.5 }}>{d.texto}</p>
                    <p style={{ fontSize: 11, color: "#9ca3af", margin: "2px 0 0" }}>
                      {d.confianza && <span>Confianza: <b style={{ color: confColor[d.confianza] || "#6b7280" }}>{d.confianza}</b></span>}
                      {d.fuente && <span> · Fuente: {d.fuente}</span>}
                    </p>
                  </div>
                ))}
              </div>
            )}

            {b2.sintesis?.no_verificados?.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: "#6b7280", margin: "0 0 6px" }}>❔ Elementos no verificados</p>
                {b2.sintesis.no_verificados.map((n, i) => <p key={i} style={{ fontSize: 13, margin: "0 0 6px", paddingLeft: 12, borderLeft: "3px solid #d1d5db", color: "#374151", lineHeight: 1.5 }}>{n}</p>)}
              </div>
            )}

            {b2.sintesis?.plataformas_pendientes?.length > 0 && (
              <div style={{ marginBottom: 14 }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: "#185FA5", margin: "0 0 6px" }}>🔎 Plataformas que requieren investigación posterior</p>
                {b2.sintesis.plataformas_pendientes.map((p, i) => <p key={i} style={{ fontSize: 13, margin: "0 0 6px", paddingLeft: 12, borderLeft: "3px solid #93c5fd", color: "#374151", lineHeight: 1.5 }}>{p}</p>)}
              </div>
            )}

            {b2.sintesis?.proximo_paso && (
              <div style={{ marginBottom: 14 }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: NAVY, margin: "0 0 6px" }}>➡️ Próximo paso</p>
                <p style={{ fontSize: 13, margin: 0, paddingLeft: 12, borderLeft: `3px solid ${GOLD}`, color: "#374151", lineHeight: 1.5 }}>{b2.sintesis.proximo_paso}</p>
              </div>
            )}

            <div style={{ background: "#f9fafb", borderRadius: 8, padding: "10px 14px" }}>
              <p style={{ fontSize: 12, color: "#374151", margin: 0 }}>📅 <b>Fecha estimada de entrega del informe de correcciones:</b> {fechaEntrega()} (aprox. 48 horas)</p>
            </div>
          </div>

          <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem", marginBottom: 12 }}>
            <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 6px", color: "#111827" }}>🗂️ Hallazgos con fuentes y nivel de confianza</p>
            <p style={{ fontSize: 11, color: "#9ca3af", margin: "0 0 12px" }}>Todos los hallazgos de la revisión inicial, con su evidencia, confianza, fuente y estado de revisión.</p>
            {allHallazgos.length === 0 && (
              <p style={{ fontSize: 12, color: "#9ca3af", margin: 0, fontStyle: "italic" }}>Sin hallazgos con evidencia suficiente en esta revisión inicial.</p>
            )}
            {allHallazgos.map((h, i) => (
              <div key={i} style={{ borderLeft: `3px solid ${h.tipo === "fortaleza" ? "#2E7D32" : "#E65100"}`, paddingLeft: 12, marginBottom: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 10, fontWeight: 600, color: NAVY, background: NAVY + "12", padding: "1px 8px", borderRadius: 8 }}>{h.canal}</span>
                  <EvBadge ev={h.evidencia} />
                </div>
                <p style={{ fontWeight: 500, fontSize: 13, margin: "2px 0", color: "#111827" }}>{h.titulo}</p>
                <p style={{ fontSize: 12, color: "#6b7280", margin: 0, lineHeight: 1.5 }}>{h.detalle}</p>
                <MetaLine h={h} />
              </div>
            ))}
          </div>

          {pendientes.length > 0 && (
            <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem", marginBottom: 12 }}>
              <p style={{ fontWeight: 500, fontSize: 14, margin: "0 0 12px", color: "#111827" }}>⏳ Pendientes de verificar ({pendientes.length})</p>
              {pendientes.map((h, i) => (
                <p key={i} style={{ fontSize: 12, margin: "0 0 6px", paddingLeft: 12, borderLeft: "3px solid #d1d5db", color: "#6b7280", lineHeight: 1.5 }}>
                  <b style={{ color: "#374151" }}>{h.canal}:</b> {h.titulo}
                </p>
              ))}
            </div>
          )}

          <div style={{ background: "#ffffff", border: "1px solid #e5e7eb", borderRadius: 12, padding: "1rem 1.25rem" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <p style={{ fontWeight: 500, fontSize: 14, margin: 0, color: "#111827" }}>💬 Mensaje de cierre (WhatsApp)</p>
              <button onClick={() => { navigator.clipboard.writeText(b2.mensaje_cierre || ""); setCopied(true); setTimeout(() => setCopied(false), 2000); }}
                style={{ fontSize: 12, padding: "4px 10px", borderRadius: 6, border: "1px solid #e5e7eb", background: copied ? "#f0fdf4" : "#f9fafb", cursor: "pointer", color: copied ? "#16a34a" : "#6b7280" }}>
                {copied ? "✓ Copiado" : "Copiar"}
              </button>
            </div>
            <div style={{ background: "#f0fdf4", borderRadius: 8, padding: "12px 14px" }}>
              <p style={{ fontSize: 13, lineHeight: 1.8, margin: 0, color: "#14532d", whiteSpace: "pre-wrap" }}>{b2.mensaje_cierre}</p>
            </div>
          </div>
        </div>
      )}

      <p style={{ textAlign: "center", fontSize: 11, color: "#9ca3af", marginTop: 20 }}>
        VersaPro Solution TX LLC · Field Prospecting · Powered by Claude AI
      </p>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
